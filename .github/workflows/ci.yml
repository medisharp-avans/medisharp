name: CI

on:
  pull_request:
    branches: [development, main]

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Client/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: Client/coverage/
          if-no-files-found: ignore
      - run: npm run build

  client-quality:
    name: client (Lighthouse & axe)
    runs-on: ubuntu-latest
    needs: client
    defaults:
      run:
        working-directory: Client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Client/package-lock.json
      - run: npm ci
      - id: build
        run: npm run build
      # Both checks start their own preview server.
      - run: npm run test:lighthouse
      # Run axe even when Lighthouse fails (but not when the build failed),
      # so both reports are always available.
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:a11y
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: Client/lighthouse-reports/
          if-no-files-found: ignore
      - name: Upload axe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-reports
          path: Client/a11y-reports/
          if-no-files-found: ignore

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Server.slnx
      - run: dotnet build Server.slnx --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release
