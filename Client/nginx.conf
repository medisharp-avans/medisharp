# Pass the scheme of the proxy in front (Traefik: https) on to the server;
# without a proxy in front (locally) fall back to our own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the ASP.NET server container (the /api prefix is stripped)
    location /api/ {
        proxy_pass http://server:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # SPA fallback so vue-router history mode works on refresh
    location / {
        try_files $uri $uri/ /index.html;
    }
}
