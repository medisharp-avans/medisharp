name: medisharp

services:
  db:
    container_name: medisharp_db
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PRODUCT_ID:-Express}
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q ''SELECT 1'' || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend
    restart: unless-stopped

  server:
    container_name: medisharp_server
    image: ghcr.io/medisharp-avans/medisharp-server:${IMAGE_TAG:-main}
    build:
      context: ./Server
      dockerfile: Dockerfile
      target: final
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=${MSSQL_DB_NAME:-Medisharp};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      JWT__Token: "${JWT_KEY:?Set JWT_KEY in .env}"
      SMTP__Username: "${SMTP_USERNAME:?Set SMTP_USERNAME in .env}"
      SMTP__Password: "${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}"
    networks:
      - backend
      - frontend
    restart: unless-stopped

  client:
    container_name: medisharp_client
    image: ghcr.io/medisharp-avans/medisharp-client:${IMAGE_TAG:-main}
    build:
      context: ./Client
      dockerfile: Dockerfile
    depends_on:
      - server
    ports:
      - "${CLIENT_PORT:-80}:80"
    networks:
      - frontend
    restart: unless-stopped

networks:
  backend:
  frontend:

volumes:
  mssql_data:
