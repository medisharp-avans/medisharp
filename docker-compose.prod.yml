name: medisharp

# Used by Dokploy for both acceptance and production.
# The images are built by GitHub Actions (.github/workflows/docker.yml) and pulled from GHCR.
# Which image is used comes from IMAGE_TAG in the Dokploy environment (staging or production).
# To build and run this stack on your own machine, add docker-compose.build.yml (see README 1.7).

services:
  db:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PRODUCT_ID:-Express}
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q ''SELECT 1'' || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend
    restart: unless-stopped

  server:
    image: ghcr.io/medisharp-avans/medisharp-server:${IMAGE_TAG:-production}
    # The tag (staging / production) moves with every deploy, so always fetch the newest image.
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=${MSSQL_DB_NAME:-Medisharp};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
    networks:
      - backend
      - frontend
    restart: unless-stopped

  client:
    image: ghcr.io/medisharp-avans/medisharp-client:${IMAGE_TAG:-production}
    pull_policy: always
    depends_on:
      - server
    # No ports: Dokploy's Traefik reaches the client through the domain you add in Dokploy.
    networks:
      - frontend
    restart: unless-stopped

networks:
  backend:
  frontend:

volumes:
  mssql_data:
